name: render-railroads
on:
  workflow_dispatch: {}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Render (Remotion + three.js)
        run: npx remotion render src/index.ts Railroads out/railroads_remake.mp4 --gl=swangle --concurrency=2
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: railroads_remake
          path: out/railroads_remake.mp4
      - name: Commit render back to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f out/railroads_remake.mp4
          git diff --cached --quiet || git commit -m "render: railroads_remake.mp4 (actions)"
          git push
